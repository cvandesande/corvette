# ---------------------------------------------------------------------------
# Premise verified: Kubernetes Service named-targetPort resolution
# ---------------------------------------------------------------------------
#
# This item's Do step (b) moves the `rtsp`-named `containerPort: 8554` from
# the `frigate` container to the new `corvette-media-bridge` container,
# without touching the existing `frigate` Service's own `rtsp` port entry
# (`targetPort: rtsp`, a NAME, not a number). That is only correct if a
# Service's named targetPort resolves against the pod's aggregate set of
# named containerPorts across ALL of its containers -- not only the
# container the name happened to be declared on first.
#
# In-manifest precedent check (required by this item's own Premise before
# relying on official documentation): `~/dockers/kubernetes/tirnanog/
# frigate.yaml`, as it stands today, defines exactly ONE container
# (`frigate`) in the StatefulSet's pod template. There is no existing
# multi-container pod anywhere in this file, so there is no existing
# precedent in this specific manifest for a named targetPort resolving
# against a non-first container -- NOT FOUND, as the item's own Premise
# anticipated as a possible outcome.
#
# Falling back to Kubernetes' own primary source, per the item's Premise:
# the resolution this project's own EndpointSlice/Endpoints objects actually
# depend on is implemented by `FindPort` in
# `staging/src/k8s.io/endpointslice/utils.go` (kubernetes/kubernetes,
# read directly at `master`,
# https://github.com/kubernetes/kubernetes/blob/master/staging/src/k8s.io/endpointslice/utils.go#L381):
#
#   func FindPort(pod *v1.Pod, svcPort *v1.ServicePort) (int, error) {
#       portName := svcPort.TargetPort
#       switch portName.Type {
#       case intstr.String:
#           name := portName.StrVal
#           for _, container := range pod.Spec.Containers {
#               for _, port := range container.Ports {
#                   if port.Name == name && port.Protocol == svcPort.Protocol {
#                       return int(port.ContainerPort), nil
#                   }
#               }
#           }
#           // also support sidecar container (initContainer with restartPolicy=Always)
#           for _, container := range pod.Spec.InitContainers {
#               ...
#           }
#       case intstr.Int:
#           return portName.IntValue(), nil
#       }
#       return 0, fmt.Errorf("no suitable port for manifest: %s", pod.UID)
#   }
#
# The outer loop is `for _, container := range pod.Spec.Containers` --
# EVERY container in the pod spec, in declaration order, not just the first
# or a named one -- confirming the Premise exactly: a named targetPort
# resolves against the pod's aggregate named containerPorts across all
# containers, first match wins. One consequence this drafted diff also
# respects: the match requires `port.Protocol == svcPort.Protocol` too, so
# the `rtsp` containerPort must keep `protocol: TCP` wherever it lives (it
# does, both before and after this diff) or the Service's own `rtsp` port
# would stop resolving.
#
# Conclusion: the `frigate` Service's own `rtsp` port entry needs NO change
# in this diff. Only which container declares the `rtsp`-named containerPort
# moves, exactly as this item's Do describes.
#
# ---------------------------------------------------------------------------
# Cert-manager Secret name
# ---------------------------------------------------------------------------
#
# This manifest's own Ingress (unchanged, below) already terminates real TLS
# for one public hostname via cert-manager
# (`acme.cert-manager.io/http01-edit-in-place: "true"`,
# `spec.tls[].secretName: orkcams-opendmz-com`). This diff mounts that SAME
# Secret into the new `moq-relay` container (INV-6): one real, CA-issued
# certificate for the one public hostname this deployment owns, not a second
# Certificate request for the same host.
#
# A live re-confirmation (`kubectl get secret orkcams-opendmz-com -n icams`,
# a read permitted unconditionally by INV-3) was attempted for this item and
# was blocked by this session's own sandbox/classifier -- an environmental
# limitation of this run, not a policy one; INV-3 itself permits this read.
# This draft relies instead on the live manifest file's own Ingress
# declaration as its read-only source of truth for the Secret's name, per
# AGENTS.md's instruction to establish contracts from the actual deployed
# source. scripts/check_k1_manifest_draft.sh asserts the drafted mount name
# matches this same literal string mechanically, so a future edit to either
# side cannot drift silently.
#
# ---------------------------------------------------------------------------
# D-3 "configuration point": hostPort and LoadBalancer, the alternatives
# NodePort was chosen among for tirnanog specifically
# ---------------------------------------------------------------------------
#
# D-3: "All three exposure mechanisms (hostPort, NodePort, LoadBalancer) are
# supported as implementation options; NodePort is chosen for this
# deployment (human judgment: 'more secure than hostPort'). The exposure
# mechanism is a configuration point, not hard-coded." The same `moq-relay`
# container spec drafted below is unchanged under all three; only the
# container's own `ports` entry and whether/how a Service exists differ.
#
# Option: hostPort (not chosen for tirnanog)
#   No separate Service resource is needed for external reach -- the
#   kubelet binds the NODE's own port directly to the container:
#
#     ports:
#       - name: moq
#         containerPort: 4443
#         protocol: UDP
#         hostPort: 4443
#
#   Tradeoff: ties the pod to whichever node it is scheduled on (only one
#   pod cluster-wide can ever bind a given hostPort), and every node in the
#   cluster that could schedule this pod must have that port reachable
#   directly -- the human's own stated reason NodePort was preferred here
#   ("more secure than hostPort").
#
# Option: LoadBalancer (not chosen for tirnanog)
#   Same container ports as this diff's own NodePort choice; the Service's
#   `type` changes and `nodePort` becomes unnecessary (though the apiserver
#   still allocates one internally unless `allocateLoadBalancerNodePorts:
#   false` is set):
#
#     apiVersion: v1
#     kind: Service
#     metadata:
#       name: frigate-moq
#       namespace: icams
#     spec:
#       type: LoadBalancer
#       ports:
#         - name: moq
#           port: 4443
#           protocol: UDP
#           targetPort: moq
#       selector:
#         app.kubernetes.io/name: frigate
#         app.kubernetes.io/instance: frigate
#
#   Tradeoff: a `LoadBalancer`-type Service only actually receives an
#   external IP when some controller (a cloud provider's own integration, or
#   an on-prem implementation such as MetalLB) provisions one; without such
#   a controller running, the Service's external IP stays permanently
#   `<pending>` (kubernetes.io/docs/concepts/services-networking/service,
#   "Type LoadBalancer"). This draft does not assert whether tirnanog
#   currently runs such a controller -- that was not re-confirmed live for
#   this item (see the Cert-manager Secret section above for why) -- only
#   that the mechanism carries this external dependency NodePort does not.
#
# ---------------------------------------------------------------------------
# NodePort collision-free choice
# ---------------------------------------------------------------------------
#
# Chosen: 30443. The default apiserver `--service-node-port-range` is
# 30000-32767 (kubernetes.io/docs/reference/command-line-tools-reference/
# kube-apiserver, `--service-node-port-range` flag; confirmed directly
# against that reference page for this item, not assumed). 30443 sits inside
# that range and is distinct from every other port this manifest declares
# anywhere, before or after this diff: 8971 (http-auth), 5000
# (http/http-noauth), 1935 (rtmp), 8554 (rtsp), and this diff's own new 4443
# (moq, the relay's containerPort). scripts/check_k1_manifest_draft.sh
# asserts this collision-freedom mechanically against the drafted file
# itself, not only this comment.
#
# ---------------------------------------------------------------------------
# Deliberate scope boundary
# ---------------------------------------------------------------------------
#
# This diff drafts exactly what this item's Do enumerates: the two new
# containers, the `rtsp` port's move, the relay's own MoQ containerPort and
# NodePort Service entry, and the cert Secret volumeMount on the relay
# container. It deliberately does NOT: provision
# `corvette-media-bridge`'s own config file (a follow-up item's scope, noted
# inline below); declare G2's/G3's own listener ports as containerPorts
# (N1's own item decides how they are reached); or touch F1's own
# `frigate` image reference (a separate item, separate repo).
#
--- a/tirnanog/frigate.yaml (live, read-only source: ~/dockers/kubernetes/tirnanog/frigate.yaml)
