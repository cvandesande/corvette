 ---
+# New Service (issue #12 item K1, D-3/D-6): exposes moq-relay's external
+# QUIC/WebTransport listener directly, not proxied through nginx
+# (RESEARCH-webtransport-ingress.md F-2). A separate Service object, not a
+# port added to the existing `frigate` Service above, because `nodePort` is
+# only a valid field on a Service whose spec.type is NodePort or
+# LoadBalancer -- the api server rejects it on a ClusterIP Service
+# (kubernetes.io/docs/concepts/services-networking/service, "Type NodePort"
+# section). D-3: NodePort is the exposure mechanism chosen for tirnanog
+# specifically (human judgment: "more secure than hostPort"); hostPort and
+# LoadBalancer are both supported alternatives -- see this file's own
+# trailing comment for the same container/Service under each.
+apiVersion: v1
+kind: Service
+metadata:
+  name: frigate-moq
+  namespace: icams
+  labels:
+    app.kubernetes.io/name: frigate
+spec:
+  type: NodePort
+  ports:
+    - name: moq
+      port: 4443
+      protocol: UDP
+      # Resolved against the POD's aggregate named containerPorts across ALL
+      # containers, not only this Service's own first/only container --
+      # confirmed directly against the Kubernetes endpoint-resolution source
+      # (see this file's header comment, "Premise verified" section, for the
+      # exact function and citation). The `moq` name lives on the new
+      # `moq-relay` container below.
+      targetPort: moq
+      # Default apiserver --service-node-port-range is 30000-32767
+      # (kubernetes.io/docs/reference/command-line-tools-reference/
+      # kube-apiserver, --service-node-port-range flag). 30443 is chosen
+      # inside that range, distinct from every other port this manifest
+      # declares anywhere (8971, 5000, 1935, 8554, 4443) -- see
+      # scripts/check_k1_manifest_draft.sh, which asserts this mechanically
+      # rather than trusting this comment.
+      nodePort: 30443
+  selector:
+    app.kubernetes.io/name: frigate
+    app.kubernetes.io/instance: frigate
+---
