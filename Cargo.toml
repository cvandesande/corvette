[workspace]
resolver = "3"
members = [
    "crates/corvette-api",
    "crates/corvette-api-server",
    "crates/corvette-media-bridge",
    "crates/corvette-ncnn",
    "crates/corvette-rtsp-client",
    "crates/corvette-ui",
    "crates/corvette-ui-server",
    "crates/corvette-yolo",
    "crates/ncnn-sys",
    "crates/ncnn-spike",
    "crates/rtsp-restream",
]

[[workspace.metadata.leptos]]
name = "corvette-ui"
bin-package = "corvette-ui-server"
lib-package = "corvette-ui"
output-name = "corvette"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "crates/corvette-ui/styles.css"
assets-dir = "crates/corvette-ui/public"
lib-features = ["split"]
lib-default-features = false
bin-default-features = false
site-addr = "127.0.0.1:8080"
reload-port = 8081

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"

# Pinned to the rev the research read, not HEAD; full comparison: .agents/issue-12/evidence/R1-dependency-pin.md
[workspace.dependencies]
moq-net = { git = "https://github.com/moq-dev/moq", rev = "7b73c43381a7f9c309e3045a8f0f858aa32ef48c", package = "moq-net" }
moq-mux = { git = "https://github.com/moq-dev/moq", rev = "7b73c43381a7f9c309e3045a8f0f858aa32ef48c", package = "moq-mux" }
hang = { git = "https://github.com/moq-dev/moq", rev = "7b73c43381a7f9c309e3045a8f0f858aa32ef48c", package = "hang" }

[profile.release]
debug = 1

# Leptos needs the archived proc-macro-error2 2.0.1; the vendor copy adds rust-lang/rust#127909's re-export.
[patch.crates-io]
proc-macro-error2 = { path = "vendor/proc-macro-error2" }

# Clippy lint groups; `restriction` excluded (upstream says it holds mutually exclusive lints); priority -1 lets the entries below win.
[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

undocumented_unsafe_blocks = "deny"

disallowed_methods = "deny"

cargo_common_metadata = "allow"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"
missing_debug_implementations = "deny"
