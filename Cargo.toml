[workspace]
resolver = "3"
members = [
    "crates/corvette-api",
    "crates/corvette-rtsp-client",
    "crates/corvette-ui",
    "crates/corvette-ui-server",
    "crates/ncnn-sys",
    "crates/ncnn-spike",
]

[[workspace.metadata.leptos]]
name = "corvette-ui"
bin-package = "corvette-ui-server"
lib-package = "corvette-ui"
output-name = "corvette"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "crates/corvette-ui/styles.css"
assets-dir = "crates/corvette-ui/public"
lib-features = ["split"]
lib-default-features = false
bin-default-features = false
site-addr = "127.0.0.1:8080"
reload-port = 8081

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"

[profile.release]
debug = 1

# Leptos still relies on the archived 2.0.1 release. The local copy preserves
# that release and applies rust-lang/rust#127909's required public re-export.
[patch.crates-io]
proc-macro-error2 = { path = "vendor/proc-macro-error2" }

# Everything clippy has that is meant to be enabled as a group. `restriction` is
# deliberately not among them -- upstream says so itself, since it contains
# mutually exclusive lints and ones that fight ordinary code -- so the few of its
# lints that earn their place here are listed individually below.
#
# Group entries carry priority = -1 so the specific allows that follow win.
[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# From `restriction`: this is an FFI crate, so every unsafe block should have to
# say why it is sound.
undocumented_unsafe_blocks = "deny"

# From `restriction`, configured via the root `clippy.toml`: corvette-rtsp-client
# must never block the async runtime with a synchronous socket call (issue #18
# INV-5). No crate in this workspace currently has a legitimate reason to call
# any of the denied paths, so this is enabled workspace-wide rather than only
# for that one crate.
disallowed_methods = "deny"

# There is no remote yet, so `cargo` cannot have its repository/keywords.
cargo_common_metadata = "allow"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"
missing_debug_implementations = "deny"
