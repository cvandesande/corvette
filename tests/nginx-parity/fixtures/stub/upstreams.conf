# Stand-ins for the two upstreams the static serving path reaches: Frigate's
# API, whose /auth endpoint every auth_request subrequest resolves against, and
# go2rtc, whose player page deployed nginx proxies as a single file.
#
# Runs as its own nginx master beside the one under test, sharing its prefix
# but not its file names. Every path with no fixture answers 404 with a body
# that names this stub, so a check that wanders outside what the harness models
# fails loudly instead of reading a plausible-looking response as real.
daemon on;
worker_processes 1;

error_log logs/stub-error.log warn;
pid logs/stub.pid;

events {
    worker_connections 64;
}

http {
    include mime.types;
    default_type text/plain;
    access_log logs/stub-access.log;

    # Frigate's API. 202 is the status its /auth endpoint returns for an
    # authorised request, and the only thing auth_request looks at.
    server {
        listen 127.0.0.1:15001;

        location = /auth {
            return 202;
        }

        location / {
            return 404 "upstream stub: no fixture for this path\n";
        }
    }

    # go2rtc. Serves the one file deployed nginx proxies from it.
    server {
        listen 127.0.0.1:11984;
        root stub;

        location = /webrtc.html {
        }

        location / {
            return 404 "upstream stub: no fixture for this path\n";
        }
    }
}
