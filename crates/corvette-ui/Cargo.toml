[package]
name = "corvette-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Browser interface for the Corvette NVR"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["split"]
split = []

[dependencies]
corvette-api = { path = "../corvette-api" }
gloo-net = { version = "0.6.0", features = ["json"] }
js-sys = "=0.3.98"
leptos = { version = "0.8.20", features = ["csr"] }
leptos_router = "0.8.14"
wasm-bindgen = "=0.2.121"
web-sys = { version = "=0.3.98", features = ["HtmlVideoElement", "KeyboardEvent", "Location", "Window"] }

[lints]
workspace = true
