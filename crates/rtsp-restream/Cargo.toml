[package]
name = "rtsp-restream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Dual MIT/Apache-2.0, not `license.workspace` (Corvette's own bare MIT):
# issue #12 item X1's plan text requires this crate to be usable outside
# Corvette (D-6), and dual MIT/Apache-2.0 is the more interoperable choice
# for a crate meant for external reuse. See LICENSE-MIT and LICENSE-APACHE.
license = "MIT OR Apache-2.0"
description = "A from-scratch, embeddable RTSP restream server: OPTIONS/DESCRIBE/SETUP/PLAY/TEARDOWN over TCP-interleaved transport, against a caller-supplied frame source"

[dependencies]
rtsp-types = "0.1.3"
sdp-types = "0.2.0"
# Only for base64-encoding SDP `sprop-parameter-sets`/`sprop-vps`/`sprop-sps`/
# `sprop-pps` values (RFC 6184/RFC 7798) -- not a session-engine or transport
# dependency. D-7 rejects rtsp-runtime/bairelay-rtsp as *session engines*;
# it does not forbid a small, already-vetted encoding crate this workspace's
# own corvette-rtsp-client depends on for the same purpose in the opposite
# direction (decoding, not encoding).
base64 = "0.22.1"
# Only for issue #12 item X3's own async I/O layer (`TcpListener`/per-
# connection tasks): `net`/`rt`/`sync`/`io-util` mirror exactly the feature
# set `corvette-rtsp-client` already depends on for the same TCP/async-task
# purpose in the opposite (client) direction.
tokio = { version = "1.53.1", features = ["net", "rt", "sync", "io-util"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
# Test-only: issue #12 item X2's own round-trip fixtures feed this crate's
# packetizer output back through issue #18's already-shipped, already-
# reviewed H264Depacketizer/H265Depacketizer as an independent correctness
# oracle. A dev-dependency never ships with this crate's own published
# artifact and adds nothing to what an external reuser of this crate
# depends on, so it does not compromise D-6's "usable outside Corvette"
# requirement -- unlike the crate's own `src/`, which INV-1's license
# manifest check (tests/inv1_license_manifest.rs) keeps free of this
# literal.
corvette-rtsp-client = { path = "../corvette-rtsp-client" }

[lints]
workspace = true
