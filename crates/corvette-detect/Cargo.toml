[package]
name = "corvette-detect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Supervises one operating-system child process, restarting it with a doubling delay"

[dependencies]
corvette-detect-proto = { path = "../corvette-detect-proto" }
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
corvette-motion = { path = "../corvette-motion" }
tokio = { version = "1.53.1", features = ["macros", "rt"] }

[lints]
workspace = true
